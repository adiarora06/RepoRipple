name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and verify distributions
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Check release versions
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import json
          import os
          import pathlib
          import tomllib

          expected = os.environ["RELEASE_TAG"].removeprefix("v")
          package = tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"]
          registry_document = json.loads(pathlib.Path("server.json").read_text())
          registry = registry_document["version"]
          registry_package = registry_document["packages"][0]["version"]
          if package != expected or registry != expected or registry_package != expected:
              raise SystemExit(
                  f"release tag {expected!r}, package {package!r}, and registry "
                  f"{registry!r}/{registry_package!r} must match"
              )
          PY

      - name: Install project and build tooling
        run: python -m pip install --upgrade build twine && python -m pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest

      - name: Build wheel and source distribution
        run: python -m build

      - name: Validate package metadata
        run: python -m twine check --strict dist/*

      - name: Smoke-test built wheel
        run: |
          python -m venv /tmp/reporipple-smoke
          /tmp/reporipple-smoke/bin/python -m pip install dist/*.whl
          /tmp/reporipple-smoke/bin/reporipple --help
          /tmp/reporipple-smoke/bin/reporipple examples/checkout-demo \
            --changed src/checkout_demo/billing/store.py \
            --format all \
            --output /tmp/reporipple-smoke-reports
          test -s /tmp/reporipple-smoke-reports/impact.md
          test -s /tmp/reporipple-smoke-reports/impact.json
          test -s /tmp/reporipple-smoke-reports/impact.html

      - name: Store distributions
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error
          retention-days: 1

  publish-python:
    name: Publish to PyPI
    needs: attest
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/p/reporipple
    permissions:
      id-token: write

    steps:
      - name: Retrieve distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish distributions
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1

  attest:
    name: Attest build provenance
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write

    steps:
      - name: Retrieve distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: python-package-distributions
          path: dist/

      - name: Attest distributions
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*

  publish-mcp:
    name: Publish to MCP Registry
    needs: publish-python
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Wait for the PyPI version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version="${RELEASE_TAG#v}"
          for attempt in 1 2 3 4 5 6; do
            if curl --fail --silent --show-error \
              "https://pypi.org/pypi/reporipple/${version}/json" > /dev/null; then
              exit 0
            fi
            sleep 10
          done
          echo "PyPI did not expose reporipple ${version} in time" >&2
          exit 1

      - name: Install verified MCP publisher
        run: |
          curl --fail --location --silent --show-error \
            --output mcp-publisher.tar.gz \
            https://github.com/modelcontextprotocol/registry/releases/download/v1.8.1/mcp-publisher_linux_amd64.tar.gz
          echo "a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc  mcp-publisher.tar.gz" \
            | sha256sum --check --strict
          tar --extract --gzip --file mcp-publisher.tar.gz mcp-publisher

      - name: Authenticate to MCP Registry
        run: ./mcp-publisher login github-oidc

      - name: Publish MCP server metadata
        run: ./mcp-publisher publish
