[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "reporipple"
version = "0.4.0"
description = "Deterministic change-impact analysis for engineers and coding agents."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Adi Arora" }]
keywords = [
  "developer-tools",
  "git",
  "static-analysis",
  "code-review",
  "ai-agents",
  "github-actions",
  "mcp",
]
dependencies = [
  "mcp>=2.0,<3",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Quality Assurance",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "ruff>=0.11",
]

[project.scripts]
reporipple = "reporipple.cli:main"

[project.urls]
Homepage = "https://www.adiarora.dev/open-source/reporipple"
Documentation = "https://github.com/adiarora06/RepoRipple#readme"
Issues = "https://github.com/adiarora06/RepoRipple/issues"
Source = "https://github.com/adiarora06/RepoRipple"
Changelog = "https://github.com/adiarora06/RepoRipple/blob/main/CHANGELOG.md"
"MCP setup" = "https://github.com/adiarora06/RepoRipple/blob/main/docs/mcp.md"

[tool.hatch.build.targets.wheel]
packages = ["src/reporipple"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
